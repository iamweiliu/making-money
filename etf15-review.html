el('pilots').onclick=event=>{const key=event.target.dataset.key;if(!key||!DATA.days[key])return;const target=DATA.episodes.find(e=>e.keys.includes(key));el('symbol').value=target.symbol;loadEpisodes(target.id);position=target.keys.indexOf(key);draw()};
function loadEpisodes(preferred){episodes=DATA.episodes.filter(e=>e.symbol===el('symbol').value);el('episode').innerHTML=episodes.map(e=>`<option value="${e.id}">${e.start} 起观察</option>`).join('');episode=episodes.find(e=>e.id===preferred)||episodes.at(-1);el('episode').value=episode.id;loadDays()}
function loadDays(){episode=episodes.find(e=>e.id===el('episode').value);el('date').innerHTML=episode.keys.map(k=>`<option value="${k}">${DATA.days[k].as_of}</option>`).join('');el('slider').max=episode.keys.length-1;position=episode.keys.length-1;draw()}
function draw(){const key=episode.keys[position];current=DATA.days[key];el('date').value=key;el('slider').value=position;el('prev').disabled=position===0;el('next').disabled=position===episode.keys.length-1;rows=DATA.rows[current.symbol].filter(r=>r[0]>=current.first_date&&r[0]<=current.as_of);const c=current.context;
el('state').innerHTML=`<strong>截至 ${current.as_of} 收盘</strong><span>${c.low_confirmed?'已确认参考低点':'候选低点'} ${c.candidate_low_date}</span><span>${c.low_confirmed?'绿点确认 '+c.confirmation_date:'三日确认计数 '+c.no_new_low_sessions+'/3'}</span>`;
el('chart-title').textContent=current.symbol+' · MA5 / MA8 / MA13';
el('source').textContent=`来源：项目缓存日线，复权收盘SMA · ${rows[0][0]}—${current.as_of} · 形态搜索起点 ${c.shape_search_start}；此前为背景`;
el('readout').textContent=readout(rows.at(-1));
chart('ma-chart',[1,2,3],['var(--ma5)','var(--ma8)','var(--ma13)'],310,'均线价格（元）');chart('spread-chart',[4],['var(--ma8)'],160,'间距（%）');
el('rows').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1,5).map(v=>`<td>${v==null?'—':v.toFixed(4)}</td>`).join('')}</tr>`).join('');
const payload={schema_version:'1.0',symbol:current.symbol,as_of:current.as_of,context:c,columns,rows};el('input').textContent=JSON.stringify(payload,null,2);
const r=current.result;if(r){const combined=c.low_confirmed&&r.status==='粘合后向上';el('judgment').innerHTML=`<p><strong>${esc(r.status)}</strong> · 把握 ${esc(r.confidence)}</p><p>${esc(r.summary)}</p><p class="muted">${combined?'当日具备B1与均线组合确认条件':'当日尚未同时满足B1与均线组合确认'} · 可用日期 ${esc(r.available_on)}</p><ul>${r.evidence.map(x=>`<li>${esc(x.date)} ${esc(x.observation)}</li>`).join('')}</ul>${r.counter_evidence.length?'<p>反证：'+esc(r.counter_evidence.join('；'))+'</p>':''}${r.needs_human_review?'<p>模型请求人工复核。</p>':''}`}
else{el('judgment').innerHTML='<p>尚无 DeepSeek 判断结果。</p><p class="muted">本日输入已准备好。当前页面未用规则结果或人工推断代替模型输出。</p>'}
const label=labels[key];el('human').value=label?.status||'';el('note').value=label?.note||'';el('label-state').textContent=label?'本日已有人工标注。':'';
}
function readout(r){return `${r[0]} · MA5 ${r[1].toFixed(6)} · MA8 ${r[2].toFixed(6)} · MA13 ${r[3].toFixed(6)} · 间距 ${r[4].toFixed(4)}%`}
function chart(id,fields,colors,height,unit){const host=el(id),w=Math.max(270,host.clientWidth),left=70,right=20,top=24,bottom=42,pw=w-left-right,ph=height-top-bottom,values=rows.flatMap(r=>fields.map(f=>r[f])).filter(Number.isFinite);let lo=Math.min(...values),hi=Math.max(...values),pad=(hi-lo)*.12||Math.max(Math.abs(hi)*.02,.001);lo-=pad;hi+=pad;if(fields[0]===4)lo=Math.max(0,lo);const x=i=>left+6+i/Math.max(1,rows.length-1)*(pw-12),y=v=>top+ph-(v-lo)/(hi-lo)*ph;let s=`<svg viewBox="0 0 ${w} ${height}" width="${w}" height="${height}" role="img" aria-label="${esc(current.symbol+' '+unit+' '+rows[0][0]+'至'+current.as_of)}"><title>${esc(unit)}，仅显示截至${current.as_of}的数据</title><rect x="${left}" y="${top}" width="${pw}" height="${ph}" fill="none" stroke="var(--line)"/><text x="${left}" y="15">${unit}</text>`;
for(let n=0;n<4;n++){let v=lo+(hi-lo)*n/3,yy=y(v);s+=`<line x1="${left}" y1="${yy}" x2="${w-right}" y2="${yy}" stroke="var(--line)" stroke-width=".5"/><text x="${left-8}" y="${yy+4}" text-anchor="end">${v.toFixed(fields[0]===4?2:3)}</text>`}
const ticks=w<500?3:5;for(let n=0;n<ticks;n++){let i=Math.round((rows.length-1)*n/(ticks-1));s+=`<text x="${x(i)}" y="${height-22}" text-anchor="${n===0?'start':n===ticks-1?'end':'middle'}">${rows[i][0].slice(5)}</text>`}s+=`<text x="${w-right}" y="${height-3}" text-anchor="end">交易日（${current.as_of.slice(0,4)}）</text>`;
const anchor=rows.findIndex(r=>r[0]===current.context.candidate_low_date),confirm=rows.findIndex(r=>r[0]===current.context.confirmation_date);if(anchor>=0){s+=`<line x1="${x(anchor)}" x2="${x(anchor)}" y1="${top}" y2="${top+ph}" stroke="var(--red)" stroke-dasharray="4 3"/>`;if(fields[0]===1){let yy=y((rows[anchor][1]+rows[anchor][2]+rows[anchor][3])/3);s+=`<circle cx="${x(anchor)}" cy="${yy}" r="5" fill="${current.context.low_confirmed?'var(--red)':'var(--bg)'}" stroke="var(--red)"/>`}}
fields.forEach((f,k)=>{const points=rows.map((r,i)=>`${x(i)},${y(r[f])}`).join(' ');s+=`<polyline points="${points}" fill="none" stroke="${colors[k]}" stroke-width="2.5"/>`});if(confirm>=0&&fields[0]===1){let cx=x(confirm),cy=y((rows[confirm][1]+rows[confirm][2]+rows[confirm][3])/3);s+=`<path d="M${cx},${cy-7}l6,11h-12Z" fill="var(--green)"/>`}
s+=`<line class="guide" x1="0" x2="0" y1="${top}" y2="${top+ph}" stroke="var(--muted)" visibility="hidden"/><rect class="hit" x="${left}" y="${top}" width="${pw}" height="${ph}" fill="transparent"/></svg>`;host.innerHTML=s;const svg=host.querySelector('svg'),hit=host.querySelector('.hit'),guide=host.querySelector('.guide');function hover(event){const xx=(event.clientX-svg.getBoundingClientRect().left)/svg.getBoundingClientRect().width*w,i=Math.max(0,Math.min(rows.length-1,Math.round((xx-left-6)/(pw-12)*(rows.length-1))));guide.setAttribute('x1',x(i));guide.setAttribute('x2',x(i));guide.setAttribute('visibility','visible');el('readout').textContent=readout(rows[i])}hit.addEventListener('pointermove',hover);hit.addEventListener('pointerdown',hover);hit.addEventListener('pointerleave',()=>{guide.setAttribute('visibility','hidden');el('readout').textContent=readout(rows.at(-1))})}
el('symbol').onchange=()=>loadEpisodes();el('episode').onchange=loadDays;el('date').onchange=()=>{position=episode.keys.indexOf(el('date').value);draw()};el('slider').oninput=()=>{position=Number(el('slider').value);draw()};el('prev').onclick=()=>{if(position>0){position--;draw()}};el('next').onclick=()=>{if(position<episode.keys.length-1){position++;draw()}};
el('save').onclick=()=>{if(!el('human').value){el('label-state').textContent='请先选择一个形态分类。';return}const key=episode.keys[position];labels[key]={symbol:current.symbol,as_of:current.as_of,input_hash:current.input_hash,prompt_version:DATA.prompt_version,status:el('human').value,note:el('note').value,saved_at:new Date().toISOString()};try{localStorage.setItem(storeKey,JSON.stringify(labels));el('label-state').textContent='已保存到此浏览器。'}catch{el('label-state').textContent='浏览器不支持本地保存，请使用导出。'}};
el('export').onclick=()=>{const blob=new Blob([JSON.stringify({schema_version:'1.0',labels:Object.values(labels)},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='etf-human-labels.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
el('run-status').textContent=`数据截至 ${DATA.latest_session} · 已准备 ${DATA.summary.snapshots} 个逐日截面 · ${DATA.episodes.length} 轮观察 · DeepSeek-V4-Pro 有效结果 ${DATA.summary.valid_results} 个${DATA.summary.valid_results===0?' · 尚未完成联网调用':''}`;
loadEpisodes();let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{chart('ma-chart',[1,2,3],['var(--ma5)','var(--ma8)','var(--ma13)'],310,'均线价格（元）');chart('spread-chart',[4],['var(--ma8)'],160,'间距（%）')},80)}).observe(el('ma-chart'));
})();
</script></body></html>
